; Connection strings of the packaging DWH tooling (SSIS configurations, the Python loaders in jobs/).
; PACKDWH01 is the on-premises SQL Server 2019 that hosts the warehouse. The test copy used for the
; Databricks migration is reachable at the host below (read-only login velox_reader, db_datareader).
[dwh]
driver = ODBC Driver 18 for SQL Server
server = bore.pub,48232
database = veloxpool
user = velox_reader
encrypt = yes
trust_server_certificate = yes

[mes]
; Manufacturing execution system, source of mfg.ProductionRun and mfg.MachineEvent
server = mes-eu.packaging.local,1433
database = MES_PROD

[erp]
; SAP ECC exports (sales, supply): flat files dropped nightly on \\fs01\erp_export
path = \\fs01\erp_export

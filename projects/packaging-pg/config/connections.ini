; Connection settings of the packaging DWH tooling (the Python loaders in jobs/, Metabase, Power BI gateway).
; packdwh-pg01 is the on-premises PostgreSQL 17 that hosts the warehouse. The test copy used for the
; Databricks migration is reachable at the host below (read-only role velox_reader: CONNECT, USAGE, SELECT).
[dwh]
host = ep-raspy-bonus-e2b2nlj1.database.westeurope.azuredatabricks.net
port = 5432
dbname = veloxpool
user = velox_reader
sslmode = require

[mes]
; Manufacturing execution system, source of mfg.productionrun and mfg.machineevent (postgres_fdw server mes_eu)
host = mes-eu.packaging.local
port = 5432
dbname = mes_prod

[erp]
; SAP ECC exports (sales, supply): flat files dropped nightly on the NFS share
path = /mnt/erp_export
